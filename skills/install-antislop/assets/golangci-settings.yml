# antislop settings for golangci-lint, with every option at its default.
# Generated by `make gendocs` from the analyzer registry; do not edit by hand.
#
# Merge this block into .golangci.yml under the custom linter entry, keeping
# the surrounding indentation:
#
#   linters:
#     enable: [antislop]
#     settings:
#       custom:
#         antislop:
#           type: module
#           description: Rejects low-evidence Go patterns
#           <this block>
#
# Drop the options you leave at their default. A list option is written as a
# YAML sequence here even though its command-line flag takes a comma-separated
# string, and setting it replaces the default list rather than adding to it.
settings:
  # Analyzer names to leave out. Record why in a comment.
  disable: []
  noanyparams:
    # allow signatures dictated by an interface or an externally typed slot
    allow-dictated: true
    # allow variadic ...any parameters
    allow-variadic: true
  noanyreturns:
    # allow signatures dictated by an interface or an externally typed slot
    allow-dictated: true
  noanytypes: {}
  noanyfields: {}
  noanycontainers:
    # list of encoders whose direct container-literal arguments are not reported (replaces the default list)
    encoders: ["encoding/json.Marshal", "encoding/json.MarshalIndent", "(*encoding/json.Encoder).Encode", "encoding/json/v2.Marshal", "encoding/json/v2.MarshalWrite", "encoding/json/v2.MarshalEncode", "gopkg.in/yaml.v3.Marshal", "(*gopkg.in/yaml.v3.Encoder).Encode", "sigs.k8s.io/yaml.Marshal", "github.com/goccy/go-yaml.Marshal", "(*github.com/BurntSushi/toml.Encoder).Encode", "github.com/pelletier/go-toml/v2.Marshal"]
    # leave a container literal that fills a slot declared in this package to the finding at that declaration
    skip-declared-any: false
    # also report slices, arrays and channels whose element type is any
    slices: false
  nonarrowany:
    # allow narrowing inside a boundary function that takes an any parameter and returns error or bool
    allow-in-parse-funcs: false
    # leave narrowing of a parameter, field, or container element typed any declared in this package to the analyzer that reports the declaration
    skip-declared-any: false
    # list of standard-library sources of untyped values whose immediate result may be narrowed (replaces the default list)
    sources: ["(context.Context).Value", "(*sync.Map).Load", "(*sync.Map).LoadAndDelete", "(*sync.Map).LoadOrStore", "(*sync.Map).Swap", "(*sync/atomic.Value).Load", "(*sync/atomic.Value).Swap", "(*sync.Pool).Get", "container/heap.Pop", "container/heap.Remove", "(*container/list.Element).Value", "(*container/ring.Ring).Value", "(io/fs.FileInfo).Sys"]
  safetycomment:
    # leave unchecked assertions on a parameter, field, or container element typed any declared in this package to the analyzer that reports the declaration
    skip-declared-any: false
    # list of standard-library sources of untyped values whose immediate result may be asserted without SAFETY (replaces the default list)
    sources: ["(context.Context).Value", "(*sync.Map).Load", "(*sync.Map).LoadAndDelete", "(*sync.Map).LoadOrStore", "(*sync.Map).Swap", "(*sync/atomic.Value).Load", "(*sync/atomic.Value).Swap", "(*sync.Pool).Get", "container/heap.Pop", "container/heap.Remove", "(*container/list.Element).Value", "(*container/ring.Ring).Value", "(io/fs.FileInfo).Sys"]
  nochainedassert: {}
  noknownwidening:
    # allow a conversion forwarded to a variadic ...any parameter or written as an element of a []any literal
    allow-variadic-args: true
  nowidenassert: {}
  noreflect:
    # list of reflect.Value and reflect.Type method names to report (replaces the default list)
    methods: ["Call", "CallSlice", "FieldByName", "FieldByNameFunc", "MethodByName", "MapIndex"]
    # also report every selector into package reflect
    strict: false
  nomonkeypatch:
    # allow a test to reassign a package-level function variable
    allow-package-var-stubbing: false
    # list of import paths of patch libraries to report (replaces the default list)
    packages: ["bou.ke/monkey", "github.com/agiledragon/gomonkey", "github.com/agiledragon/gomonkey/v2", "github.com/undefinedlabs/go-mpatch"]
  nountypedunmarshal:
    # list of decoding functions as pkg/path.Func#N or (*pkg/path.Type).Method#N (replaces the default list)
    functions: ["encoding/json.Unmarshal#1", "(*encoding/json.Decoder).Decode#0", "encoding/json/v2.Unmarshal#1", "encoding/json/v2.UnmarshalRead#1", "encoding/json/v2.UnmarshalDecode#1", "gopkg.in/yaml.v3.Unmarshal#1", "(*gopkg.in/yaml.v3.Decoder).Decode#0", "sigs.k8s.io/yaml.Unmarshal#1", "github.com/goccy/go-yaml.Unmarshal#1", "github.com/BurntSushi/toml.Unmarshal#1", "github.com/pelletier/go-toml/v2.Unmarshal#1", "github.com/mitchellh/mapstructure.Decode#1", "github.com/go-viper/mapstructure/v2.Decode#1"]
  nostructuralnames:
    # list of structural terms to reject in declared names (replaces the default list)
    terms: ["shape"]
