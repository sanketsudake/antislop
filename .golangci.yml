# Stock linters for this repository. The antislop plugin itself is exercised by
# .golangci.dogfood.yml through the custom-gcl binary (make plugin).
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sanketsudake/antislop
