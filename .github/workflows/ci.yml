name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make test
      - run: make dogfood
      - run: make smoke
      - run: make gendocs-check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0
      - run: make deps-check
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor proves `golangci-lint custom` still builds for 1.26 users;
        # the newer leg proves the plugin binary analyzes Go 1.27 source.
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0
          install-only: true
      - run: make plugin
      - run: make plugin-smoke
